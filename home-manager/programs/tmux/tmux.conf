# =============================================================================
# tmux.conf — Sensible defaults
# =============================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 10000
set -g display-time 2000
set -g repeat-time 600
set -g focus-events on
set -g mouse on
set -g allow-passthrough on

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
# Default prefix is C-b. Uncomment below to change:
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# More intuitive splits (same directory as current pane)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows retain current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with arrow keys
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Vim-style copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer

# Session switcher
unbind t
bind t display-popup -E -w 40% -h 50% "fish -c 'tls --compact'"

# Fish scratch shell
unbind f
bind f display-popup -E -w 80% -h 80% "fish"

# Fuzzy buffer picker (fzf popup → enter to paste)
bind b display-popup -E -w 90% -h 85% "tmux list-buffers | cut -d: -f1 | fzf --preview='tmux show-buffer -b {}' --preview-window=right:85% > /tmp/.tmux_buf_pick" \; run-shell "buf=\$(cat /tmp/.tmux_buf_pick 2>/dev/null); rm -f /tmp/.tmux_buf_pick; [ -n \"\$buf\" ] && tmux show-buffer -b \"\$buf\" | xclip -loops 1 -selection clipboard || true"

# ---------------------------------------------------------------------------
# Indexing
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-justify left

# Status bar colors
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# Left status: session name
set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bold]  #S #[default]"

# Right status: date and time
set -g status-right-length 50
set -g status-right "#[fg=#565f89] %Y-%m-%d  %H:%M #[default]"

# Window status
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
setw -g window-status-separator ""

# ---------------------------------------------------------------------------
# Pane styling
# ---------------------------------------------------------------------------
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# ---------------------------------------------------------------------------
# Message styling
# ---------------------------------------------------------------------------
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
set -g message-command-style "bg=#1a1b26,fg=#7aa2f7"

# ---------------------------------------------------------------------------
# Bell & activity monitoring
# ---------------------------------------------------------------------------
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
